# Render Blueprint — free, no-card backend for MuscleApp (see ADR-0010 / ADR-0014).
# CD is native: Render auto-deploys on every push to the connected branch (main),
# so no GitHub Actions workflow is needed. The frontend deploys on Vercel the same way.
#
# Secrets/connection values (marked `sync: false`) are set once in the Render
# dashboard — never committed. On boot the service runs `app.bootstrap`
# (create extension + tables + seed + embedding backfill, all idempotent) and
# then serves the API with uvicorn on Render's injected $PORT.
services:
  - type: web
    name: muscleapp-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: jina
      # One-shot operational switch, so it is dashboard-managed (`sync: false`):
      # a blueprint `value:` would overwrite the dashboard on the next sync.
      # Set it to "true" for ONE deploy after changing the embedding model — the
      # stored catalog vectors are cleared and recomputed, because vectors from
      # different models are not comparable — then set it back to "false".
      # Unset behaves as false (see Settings.embedding_rebuild).
      - key: EMBEDDING_REBUILD
        sync: false
      - key: LLM_PROVIDER
        value: groq
      # Meal-photo analysis. openrouter is the only free option reachable from a
      # datacenter IP (Gemini's free tier refuses them, Groq has no vision model).
      # Slower than Gemini (~16s vs ~2s) — see ADR-0020.
      - key: VISION_PROVIDER
        value: openrouter
      - key: CACHE_PROVIDER
        value: redis
      # Signing key for the session tokens. Render generates a random value per
      # service, so the secret is never committed nor shared — and the app
      # refuses to boot in production with the development default, which is
      # what stopped the first deploy after sign-in shipped.
      - key: JWT_SECRET
        generateValue: true
      # Password of the two demo accounts, shown in the sign-in form on purpose.
      # Dashboard-managed so it can be rotated without a deploy; unset falls back
      # to the default in Settings.demo_password.
      - key: DEMO_PASSWORD
        sync: false
      # --- Set these in the Render dashboard (Environment); never committed ---
      - key: POSTGRES_HOST # from Neon
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      # jina.ai (free tier, no card) — embeddings. Google's free tier rejects
      # datacenter egress IPs ("User location is not supported"), see ADR-0019.
      - key: JINA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY # openrouter.ai (free tier, no card) — meal photos
        sync: false
      - key: GEMINI_API_KEY # Google AI Studio (free) — kept for local/dev use
        sync: false
      - key: GROQ_API_KEY # console.groq.com (free, no card) — chat LLM
        sync: false
      # Upstash (free, no card). MUST be rediss:// (TLS): a plain redis:// URL
      # fails to connect and the cache silently degrades to no cache.
      # Empty ⇒ in-memory cache.
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://muscleapp.vercel.app
        sync: false
